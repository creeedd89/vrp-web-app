services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "3001:3000"
    volumes:
      # Bind mount the host directory to /app in the container
      - .:/app
      # Use named volumes to hide Windows node_modules and .next from the container.
      # The container will store its Linux-native files here.
      - node_modules:/app/node_modules
      - next_build:/app/.next
    environment:
      - NODE_ENV=development
    command: sh -c "pnpm install --ignore-scripts && pnpm dev"

volumes:
  node_modules:
  next_build:
